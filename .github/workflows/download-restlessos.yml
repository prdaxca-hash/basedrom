name: Download and Extract RestlessOS

on:
  workflow_dispatch:

jobs:
  download-extract-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RestlessOS archive
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 5 --retry-delay 5 \
            'https://github.com/cawilliamson/treble_restlessos/releases/download/16.0.0-202606230923/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz' \
            -o 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'

      - name: Extract system.img
        run: |
          set -euo pipefail
          xz -dk 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'
          mv 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img' 'dist/system.img'
          test -s 'dist/system.img'
          ls -lh 'dist/system.img'

      - name: Upload system.img to basedrom
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create 'restlessos-16.0.0-202606230923' \
            --repo "$REPO" \
            --title 'RestlessOS 16.0.0-202606230923' \
            --notes 'Extracted system.img from RestlessOS-arm64-ab-16.0.0-202606230923.img.xz.' \
            'dist/system.img'
