name: Import RestlessOS system

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils e2fsprogs

      - name: Download RestlessOS image
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 \
            'https://github.com/cawilliamson/treble_restlessos/releases/download/16.0.0-202606230923/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz' \
            -o system.img.xz

      - name: Extract system.img filesystem
        run: |
          set -euo pipefail
          xz -d system.img.xz
          file system.img
          mkdir -p extracted
          sudo mount -o loop,ro system.img extracted
          sudo cp -a extracted/. imported-system/
          sudo umount extracted
          rm -f system.img
          test -d imported-system
          find imported-system -type f | wc -l

      - name: Replace repository contents with system filesystem
        run: |
          set -euo pipefail
          rm -rf -- ./* ./.[^.]* 2>/dev/null || true
          cp -a imported-system/. .
          rm -rf imported-system

      - name: Commit system filesystem to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import RestlessOS system filesystem'
          git push origin main
