name: Import RestlessOS system

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils e2fsprogs

      - name: Download RestlessOS image
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 \
            'https://github.com/cawilliamson/treble_restlessos/releases/download/16.0.0-202606230923/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz' \
            -o system.img.xz

      - name: Extract system.img filesystem
        run: |
          set -euo pipefail
          xz -d system.img.xz
          file system.img
          sudo mkdir -p /mnt/restlessos
          sudo mount -o loop,ro,nosuid,nodev system.img /mnt/restlessos
          sudo mkdir -p extracted
          sudo cp -a /mnt/restlessos/. extracted/
          sudo umount /mnt/restlessos
          sudo chown -R "$(id -u):$(id -g)" extracted
          rm -f system.img
          test -d extracted
          find extracted -type f | wc -l

      - name: Check repository compatibility
        run: |
          set -euo pipefail
          oversized=$(find extracted -type f -size +100M -printf '%p\n' | head -20)
          if [ -n "$oversized" ]; then
            echo 'Files over GitHub regular-Git 100 MiB limit were found:' >&2
            echo "$oversized" >&2
            exit 1
          fi

      - name: Replace repository contents with system filesystem
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'extracted' -exec rm -rf -- {} +
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit system filesystem to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import RestlessOS system filesystem'
          git push origin main
