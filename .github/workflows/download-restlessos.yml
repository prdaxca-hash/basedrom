name: Download RestlessOS

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Download RestlessOS image
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 5 --retry-delay 5 \
            'https://github.com/cawilliamson/treble_restlessos/releases/download/16.0.0-202606230923/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz' \
            -o 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'

      - name: Verify downloaded file
        run: |
          set -euo pipefail
          test -s 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'
          ls -lh 'dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz'

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestlessOS-arm64-ab-16.0.0-202606230923
          path: dist/RestlessOS-arm64-ab-16.0.0-202606230923.img.xz
          if-no-files-found: error
          retention-days: 7
